name: CI

on:
  pull_request:
    branches: [develop, master]
    paths-ignore:
      - "**.md"
      - "docs/**"
  push:
    branches: [develop, master]
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

# Un push nuevo al mismo PR/rama cancela la corrida anterior
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: 20 # Igual que la imagen de producción (node:20-alpine)
  HUSKY: 0 # Los hooks de git no hacen falta en CI

jobs:
  quality:
    name: Lint · Types · Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Lint
        run: npx eslint "{src,apps,libs}/**/*.ts"

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  test:
    name: Unit tests (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Jest
        run: npx jest --ci --silent --shard=${{ matrix.shard }}/2

  # Único check a marcar como requerido en la protección de ramas
  ci:
    name: CI
    if: always()
    needs: [quality, test]
    runs-on: ubuntu-latest
    steps:
      - name: Verify all jobs passed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
